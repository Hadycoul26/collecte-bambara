name: Générer la voix IA des phrases

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [phrases.json, outils/voix_ia.py, .github/workflows/voix-ia.yml]

permissions:
  contents: write

concurrency:
  group: voix-ia
  cancel-in-progress: false

jobs:
  voix:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Récupérer le code du projet IA Bambara (modèle de voix actuel)
        uses: actions/checkout@v4
        with:
          repository: LOSTHADY/IA_Project-
          ref: claude/focused-goldberg-uvcvdt
          path: projet

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer la synthèse vocale
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install transformers soundfile numpy pyyaml
          sudo apt-get install -y ffmpeg >/dev/null || true

      - name: Générer les voix manquantes
        env:
          PYTHONPATH: projet
        run: python outils/voix_ia.py .

      - name: Enregistrer les voix dans le dépôt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add voix
          if git diff --cached --quiet; then echo "Aucune nouvelle voix."; exit 0; fi
          git commit -m "Voix IA des phrases (bambara_voice / facebook/mms-tts-bam)"
          git pull --rebase origin main
          git push
